run:
  timeout: 5m
  go: '1.21'

linters:
  enable-all: true
  disable:
    # Deprecated linters
    - exhaustivestruct
    - golint
    - interfacer
    - maligned
    - scopelint
    # Other noisy or less useful linters
    - exhaustruct
    - nonamedreturns
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - gocyclo
    - goerr113
    - funlen
    - lll
    - wsl
    - nlreturn
    - testpackage
    - paralleltest
    - tparallel

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
